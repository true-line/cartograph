[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.80.0"
edition = "2024"
publish = false
# Source-available under PolyForm Noncommercial 1.0.0 (see LICENSE.md at the
# workspace root). Inherited path is relative to this workspace manifest.
license-file = "LICENSE.md"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

# Production release hardening (#221). Applies to every workspace binary,
# including the packaged `app` shell:
#   strip         — drop symbol tables/debuginfo from the shipped binary
#   lto="thin"    — cross-crate link-time optimization; thin keeps release
#                   build times reasonable for ~a 2 MB size cost vs fat LTO
#   codegen-units — single unit maximizes optimization (slower compile)
#   panic=abort   — no unwinding tables; smaller binary. Safe here: nothing
#                   relies on unwinding in release — source-walk's parallel
#                   merge only uses catch_unwind to re-raise a worker panic on
#                   the caller (a release panic aborts either way) — and
#                   wasmtime guest traps do not rely on host unwinding.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"

# Tests run optimized. The app suite's replay and acceptance tests spend
# their time in serialization, hashing and SQLite, and ran about ten times
# slower unoptimized (#1924). Debug assertions and overflow checks stay on:
# they come from the dev profile this one inherits.
[profile.test]
opt-level = 1

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse floats correctly rounded, so a value serialized
# and parsed again keeps its exact bits (#725).
# Exact, as Toolchain receipt closures pin it (AC-1536).
serde_json = { version = "=1.0.154", features = ["raw_value", "float_roundtrip"] }
thiserror = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
blake3 = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
usearch = { version = "2.26", default-features = false }
regex = "1"
# Every wasmtime 50 default feature except `cache`: the host never configures the
# on-disk compilation cache, and that feature alone pulls the zstd chain.
wasmtime = { version = "50.0.3", default-features = false, features = [
  "anyhow", "async", "backtrace", "gc", "gc-copying", "gc-drc", "gc-null", "wat",
  "profiling", "parallel-compilation", "cranelift", "pooling-allocator", "demangle",
  "addr2line", "coredump", "debug-builtins", "runtime", "component-model",
  "component-model-async", "threads", "stack-switching", "std", "debug",
  "compile-time-builtins", "wit-parser",
] }
wasmtime-wasi = "50.0.3"

# Internal crates (SPEC-00 §8.1 crate map)
app-store = { path = "crates/app-store" }
core-graph = { path = "crates/core-graph" }
core-prov = { path = "crates/core-prov" }
core-redact = { path = "crates/core-redact" }
context-hub = { path = "crates/context-hub" }
source-capture = { path = "crates/source-capture" }
source-walk = { path = "crates/source-walk" }
adapters-fw = { path = "crates/adapters-fw" }
adapters-plugin-host = { path = "crates/adapters-plugin-host" }
adapters-lang-ts = { path = "crates/adapters-lang-ts" }
adapters-lang-python = { path = "crates/adapters-lang-python" }
adapters-lang-go = { path = "crates/adapters-lang-go" }
adapters-lang-rust = { path = "crates/adapters-lang-rust" }
adapters-lang-java = { path = "crates/adapters-lang-java" }
adapters-lang-kotlin = { path = "crates/adapters-lang-kotlin" }
adapters-artifact-jvm = { path = "crates/adapters-artifact-jvm" }
adapters-artifact-js = { path = "crates/adapters-artifact-js" }
dynamic = { path = "crates/dynamic" }
events = { path = "crates/events" }
flowtracer = { path = "crates/flowtracer" }
ingest = { path = "crates/ingest" }
iac = { path = "crates/iac" }
spec = { path = "crates/spec" }
llm = { path = "crates/llm" }
semantic = { path = "crates/semantic" }
acp-host = { path = "crates/acp-host" }
agents = { path = "crates/agents" }
