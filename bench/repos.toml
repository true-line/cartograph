# Pinned repositories for the local scale benchmark (#1228, AC-0423).
# `node scripts/bench-ingest.mjs --work <dir>` clones each at its exact
# commit and never runs their code. Add repositories; never move a pin
# without saying so in the PR, since results are compared by pin. An
# optional `path` selects a subdirectory as the recovered source root.

