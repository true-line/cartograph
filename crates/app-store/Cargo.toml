[package]
name = "app-store"
description = "The app's durable local stores (source registry, findings register, storage paths) and job execution, split out of the Tauri shell so it compiles and tests on its own (#1924)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[lints]
workspace = true

[features]
# Test-only hooks the app's own tests call (checkout access counters,
# unconditional finding replacement). Enabled only by the app's
# dev-dependency, so no shipped build carries them.
test-support = ["dep:tempfile"]

[dependencies]
agents = { workspace = true }
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
context-hub = { workspace = true }
core-graph = { workspace = true }
core-prov = { workspace = true }
core-redact = { workspace = true }
dunce = "1"
ingest = { workspace = true }
llm = { workspace = true }
rusqlite = { workspace = true, features = ["backup"] }
semantic = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Test fixtures the app's tests share (test-support only).
tempfile = { version = "3", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
