[package]
name = "ingest"
description = "GitHub repo ingest: auth ladder, shallow read-only clone, repo identity (SPEC-00 §10, US-0001)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
core-graph = { workspace = true }
core-prov = { workspace = true }
source-walk = { workspace = true }
core-redact = { workspace = true }
adapters-fw = { workspace = true }
# Go recovery's own file filter, so skipped files are named (#1258).
adapters-lang-go = { workspace = true }
# The W6 work packet an uncovered adapter cell is handed off as (#1072).
work-packets = { workspace = true }
toml = "1.1"
# Span-preserving YAML for declared schedule files (#770).
tree-sitter = "=0.27.2"
# Exact, as Pipeline receipts record it (AC-1528).
tree-sitter-yaml = "=0.7.2"
# The `__main__` argument dispatch of a scheduled Python entry (#779).
tree-sitter-python = "0.25"
# The command-line dispatch of a Node script (`#!/usr/bin/env node`).
tree-sitter-typescript = "=0.23.2"
# Java process starts, listeners, schedules and runners (#2020).
tree-sitter-java = "0.23"
# Kotlin process starts, listeners, schedules and runners (#2021).
tree-sitter-kotlin-ng = "1.1"
# Rust process starts, Tauri IPC commands and tonic gRPC methods (#2041).
tree-sitter-rust = "0.24"
url = "2"
dunce = "1"
# Anchored no-follow reads of declared API docs, as in source-capture.
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
# libgit2 bindings; vendored so CI needs no system libgit2.
git2 = { version = "0.21", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }

[dev-dependencies]
tempfile = "3"
