[package]
name = "mcp-relay"
description = "Lean explicitly configured stdio to local IPC relay"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[lints]
workspace = true

[[bin]]
name = "cartograph-mcp"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
mcp-local = { path = "../mcp-local" }
tokio = { version = "1.53.3", features = ["io-std", "io-util", "net", "time", "rt"] }

[dev-dependencies]
mcp-wire = { path = "../mcp-wire" }
serde_json = { workspace = true }
tempfile = "3"
