# Advanced CodeQL is invoked only by governed callers (ci.yml for every lane,
# codeql-rust.yml for Rust on main) so the runtime actor is the authorized
# caller, not default setup's unselectable bot actor.
name: CodeQL

on:
  workflow_call:
    inputs:
      image:
        description: Digest reference of the Linux CI image (ci.yml ci-image)
        required: true
        type: string
      rust:
        description: Analyze Rust alone (codeql-rust.yml) instead of the per-run languages
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Rust extraction loads the workspace through cargo; the CI image carries
    # the pinned toolchain and the Tauri libraries, so no language installs
    # anything per run.
    container:
      image: ${{ inputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --user 1001
      # bounded-command runs `${{ github.action_path }}`, which the runner
      # leaves as the host path in a container (actions/runner#716,
      # true-line/trueline-agent-ci#8). Mount the work tree there too; a
      # symlink would not do, as the script's main-module check compares
      # real paths and silently skips the task.
      volumes:
        - /home/runner/work:/home/runner/work
    # Rust extraction outlived 45 minutes on every main push, so it never
    # produced an analysis while holding a heavy slot (#1373). The runtime
    # policy needs a literal timeout, so every language shares Rust's budget
    # (the others finish in minutes). Rust runs one at a time, the newest
    # pending commit replacing an older pending one; the others keep a
    # per-run group.
    timeout-minutes: 120
    concurrency:
      group: codeql-${{ matrix.language == 'rust' && 'rust' || github.run_id }}-${{ matrix.language }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Rust runs only after merge to main until the org runners stop losing
        # long jobs' working directories (#634), and in its own workflow run
        # (codeql-rust.yml): a superseded Rust analysis must never turn a main
        # commit's CI red and so block its version tag.
        language: ${{ fromJSON(inputs.rust && '["rust"]' || '["actions", "javascript-typescript"]') }}
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # The organisation's Linux runner does not carry Node on its default PATH.
      # This step reaches for `node`, or runs an action that does, so the
      # runtime is installed first, with the same pinned action the rest of
      # the workflow already uses.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Rust extraction builds the workspace on a host whose memory the
      # runners share; it waits for one of two heavy slots (#1242).
      - name: Take a host heavy-build slot
        if: matrix.language == 'rust'
        run: bash .github/scripts/heavy-slot.sh 1200

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Quality queries ride on the same analysis, so maintainability
          # findings need no separate GitHub Code Quality scan per push.
          queries: security-and-quality
          # Several runners share one host's memory; CodeQL otherwise sizes
          # itself to the whole machine and fails finalizing the Rust database.
          ram: 6144
          threads: 4

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}
          ram: 6144
          threads: 4

      # A cancelled job frees its slot when the runner reaps its processes.
      - name: Release the host heavy-build slot
        if: ${{ !cancelled() && matrix.language == 'rust' }}
        run: rm -f "$RUNNER_TEMP/cartograph-heavy-slot"
