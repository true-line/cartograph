name: CI
run-name: CI ${{ github.event_name }} purpose=${{ inputs.purpose || 'automatic' }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      purpose:
        description: Why the complete suite is being run manually
        required: true
        type: choice
        options:
          - exact-sha-preflight
          - diagnostics
          - release-recovery
          - workflow-testing
          - explicit-rerun
      local_provider_acceptance:
        description: Run the pinned local-model investigation acceptance on this runner
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('merge-group-{0}', github.event.merge_group.head_ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  actions: read
  contents: read
  pull-requests: read

# Every job runs on a GitHub-hosted runner, each a fresh VM. The self-hosted
# macOS runner is used only by release.yml/package.yml on tags.
jobs:
  policy:
    name: Action Policy
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      run_full: ${{ steps.policy.outputs.run_full }}
      run_post_merge: ${{ steps.policy.outputs.run_post_merge }}
    steps:
      # The organisation's Linux runner does not carry Node on its default PATH.
      # This step reaches for `node`, or runs an action that does, so the
      # runtime is installed first, with the same pinned action the rest of
      # the workflow already uses.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: policy
        uses: true-line/trueline-agent-ci/.github/actions/ci-policy@64ec289604e2409eb92fd718495df8a10761a20a

  merge-evidence:
    name: Verify merged commit evidence
    needs: policy
    if: needs.policy.outputs.run_post_merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      validated: ${{ steps.evidence.outputs.validated }}
    steps:
      - id: evidence
        name: Find successful merge-group or identical-tree PR CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        # The default Actions bash shell runs with errexit; turn it off so any
        # lookup failure leaves validated false, which runs the complete suite
        # fail-safe instead of failing main.
        run: |
          set +e
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=merge_group&head_sha=$GITHUB_SHA&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success") | .id) // empty')
          validated=false
          if [ -n "$run_id" ]; then
            validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          fi
          # Without a merge queue, a merged PR whose head tree is byte-identical
          # to this commit's tree already passed the ready-PR suite on exactly
          # these files; re-running it on main only duplicates that run. The
          # Version packages PR is excluded: tag and release require
          # complete-suite evidence on the exact cut commit itself.
          if [ "$validated" != true ]; then
            tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.tree.sha)
            heads=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '.[] | select(.merged_at != null and .base.ref == "main" and .head.ref != "changeset-release/main" and .head.repo.full_name == .base.repo.full_name) | .head.sha')
            for head in $heads; do
              head_tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head" --jq .commit.tree.sha)
              [ "$head_tree" = "$tree" ] || continue
              pr_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$head&per_page=100" \
                --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success") | .id) // empty')
              [ -n "$pr_run" ] || continue
              validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$pr_run/jobs?filter=latest&per_page=100" \
                --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
              if [ "$validated" = true ]; then break; fi
            done
          fi
          echo "validated=$validated" >> "$GITHUB_OUTPUT"

  preflight-evidence:
    name: Verify preflight evidence
    needs: policy
    if: github.event_name == 'pull_request' && needs.policy.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      validated: ${{ steps.evidence.outputs.validated }}
    steps:
      - id: evidence
        name: Find successful manual complete suite for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&head_sha=$TARGET_SHA&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .display_title == "CI workflow_dispatch purpose=exact-sha-preflight" and .conclusion == "success") | .id) // empty')
          validated=false
          if [ -n "$run_id" ]; then
            validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          fi
          echo "validated=$validated" >> "$GITHUB_OUTPUT"

  # Keeps the spec, user stories, traceability matrix, ADRs, release tooling,
  # and help mirror source mutually consistent in every complete suite.
  docs:
    name: Docs & traceability
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Traceability check
        run: node scripts/check-traceability.mjs

      # Every crate inherits [workspace.lints]; missing_docs allows only shrink (#1764).
      - name: Workspace lints check
        run: node scripts/check-workspace-lints.mjs

      - name: Version synchronization check
        run: npm run version:check

      - name: Version and workflow tooling tests
        run: npm run test:version

      # ADR-0085, AC-1427: the tool-calling sidecar is checked from its
      # lockfile, then built the way the app ships it (one Node single
      # executable from the pinned, checksum-verified Node) and the same
      # process tests run against that executable.
      - name: Install locked agent runtime dependencies
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@64ec289604e2409eb92fd718495df8a10761a20a
        with:
          task: Install locked agent runtime dependencies
          executable: npm
          arguments-json: '["ci", "--ignore-scripts", "--no-audit", "--no-fund"]'
          working-directory: agent-runtime
          timeout-seconds: '300'
          attempts: '2'
          retry-delay-seconds: '5'

      - name: Agent runtime typecheck and tests
        working-directory: agent-runtime
        run: |
          set -euo pipefail
          npm run typecheck
          npm test

      - name: Agent runtime packaged executable
        run: |
          set -euo pipefail
          agent=$(node scripts/build-agent-runtime.mjs x86_64-unknown-linux-gnu)
          CARTOGRAPH_AGENT_EXECUTABLE="$agent" node --test agent-runtime/test/process.test.ts

      # Validates docs/help only; the wiki never gates a PR. The post-merge
      # help-wiki-sync workflow mirrors main to the wiki (#470).
      - name: Help mirror source check
        run: node scripts/check-help-mirror.mjs --validate

  # The Rust lanes run in a prebuilt image (ci/linux.Dockerfile) holding the
  # Tauri system libraries and the pinned toolchain, so no lane downloads from
  # the Ubuntu archive or static.rust-lang.org. Every lane used to apt-install
  # about 150 packages per run; on 2026-11-19 an index read from one mirror
  # named archives the other had already replaced (404), failing every lane.
  # The tag hashes the image's inputs (scripts/ci-image-tag.mjs), so the image
  # is built and pushed only when ci/linux.Dockerfile or rust-toolchain.toml
  # changes, and each later run reuses it.
  ci-image:
    name: Linux CI image
    needs: [policy, merge-evidence, preflight-evidence]
    # Advanced CodeQL runs in the image too, and on every full or post-merge
    # lane, so the image is named whenever CodeQL runs.
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      (needs.policy.outputs.run_post_merge == 'true' || needs.policy.outputs.run_full == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Name the image
        id: tag
        run: echo "image=$(node scripts/ci-image-tag.mjs)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      # The build context is the two inputs the tag hashes, nothing else. The
      # lanes get the image by digest, so a re-pushed tag never changes what
      # an in-flight run executes.
      - name: Build and push the image when its tag is missing
        id: image
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Reusing $IMAGE"
          else
            tar -c ci/linux.Dockerfile rust-toolchain.toml |
              docker build --label "org.opencontainers.image.source=$SOURCE" -f ci/linux.Dockerfile -t "$IMAGE" -
            docker push "$IMAGE"
          fi
          digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE")
          case "$digest" in sha256:*) ;; *) echo "::error::No digest for $IMAGE"; exit 1 ;; esac
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

      # Each Dockerfile or toolchain change pushes a new image, and nothing
      # pulls the old ones again. Only main prunes: it keeps the newest three
      # and never the tag this run uses. A pruned tag is rebuilt the next time
      # a lane names it. Pruning is housekeeping and never fails the job: two
      # concurrent main runs may list the same versions, and one finds a
      # version the other already removed.
      - name: Prune old CI images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.tag.outputs.image }}
          KEEP: '3'
          PACKAGE: orgs/${{ github.repository_owner }}/packages/container/cartograph-ci
        run: |
          export TAG="${IMAGE##*:}"
          gh api --paginate "$PACKAGE/versions?per_page=100" \
            --jq '.[] | select(.metadata.container.tags | any(.[]; . == env.TAG) | not) | "\(.updated_at) \(.id)"' |
            sort -r | tail -n "+$KEEP" | while read -r _ id; do
              echo "Deleting $PACKAGE version $id"
              gh api -X DELETE "$PACKAGE/versions/$id" || echo "Version $id is already gone"
            done

  # Rust core: format, lint-as-error, tests. The pinned toolchain comes from
  # rust-toolchain.toml; the commands and stable context are unchanged.
  rust:
    name: Rust (${{ matrix.group }})
    needs: [policy, merge-evidence, preflight-evidence, ci-image]
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    # The Tauri system libraries and the rust-toolchain.toml toolchain come
    # with the CI image (see ci-image).
    runs-on: ubuntu-latest
    container:
      # A digest reference: ci-image resolves the hashed tag to its digest.
      image: ${{ needs.ci-image.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # Not root: root passes the tests that expect permission-denied errors.
      options: --user 1001
      # bounded-command runs `${{ github.action_path }}`, which the runner
      # leaves as the host path in a container (actions/runner#716,
      # true-line/trueline-agent-ci#8). Mount the work tree there too; a
      # symlink would not do, as the script's main-module check compares
      # real paths and silently skips the task.
      volumes:
        - /home/runner/work:/home/runner/work
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    # A hung mirror must fail the job in minutes, never hold its runner
    # slot to the 6-hour kill (#343; cold cargo builds finish well inside).
    # The budget is the heavy-slot wait (40 minutes) plus 49 of work: a
    # 59-minute job lost a passed Test to its cache save (#1373).
    timeout-minutes: 89
    # The test step compiles one test harness per crate, which sccache cannot
    # serve, and on a 4-vCPU runner that is CPU-bound, not a dependency chain
    # (#1924). Three groups split the harnesses across runners: `adapters` and
    # `ingest` name their packages, and `core` runs the rest of the workspace,
    # so a new crate lands in `core` instead of in no group.
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: adapters
            packages: -p adapters-lang-ts -p adapters-lang-python -p adapters-lang-java -p adapters-lang-kotlin
          # app-store runs here: job-execution-tests already builds its job
          # modules, and in `core` it made that the longest Rust lane.
          - group: ingest
            packages: -p ingest -p work-packets -p job-execution-tests -p adapters-lang-go -p app-store
          - group: core
            packages: >-
              --workspace --exclude app --exclude agents --exclude spec
              --exclude adapters-lang-ts --exclude adapters-lang-python --exclude adapters-lang-java
              --exclude adapters-lang-kotlin --exclude ingest --exclude work-packets
              --exclude job-execution-tests --exclude adapters-lang-go --exclude app-store
    # No repo-wide lane group: GitHub keeps one pending job per group, so a
    # third queued PR cancelled the one already waiting (#669). The
    # workflow-level group supersedes a PR's own older run. No lane installs
    # packages per run; the libraries come with the CI image.
    # CARGO_BUILD_JOBS is part of rust-cache's key: changing it empties the
    # cache once.
    # Tests keep file and line numbers in backtraces but drop full debuginfo,
    # which made every crate slower to compile and link (#1924). CI only: a
    # local `cargo test` keeps the dev profile's full debuginfo.
    env:
      CARGO_BUILD_JOBS: 6
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # The bounded-command action runs under node, which the organisation's
      # Linux runner does not carry on its default PATH.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # A fixed path, never one per runner: rust-cache hashes CARGO_HOME's
      # value into its key, and a hosted RUNNER_NAME is unique per job, so a
      # per-runner home missed the cache on every job and compiled cold
      # (#1924). Each hosted job is its own VM, so nothing shares the home.
      - name: Use a fixed cargo home
        run: echo "CARGO_HOME=$HOME/.cargo-ci" >> "$GITHUB_ENV"

      # Each group builds its own dependency set, so each keeps its own cache:
      # a shared key would keep only the first saver's dependencies.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.group }}

      # rust-cache keeps dependencies only; sccache serves the workspace
      # crates from the GitHub Actions cache by content hash (#1924). The
      # wrapper is exported after rust-cache computed its key, so that key and
      # the cached target directory stay as they were.
      - name: Install sccache
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        # Per-runner home: install-action rm -rfs its shared ~/.install-action/tmp
        # after each install, deleting a concurrent runner's download (#674).
        env:
          HOME: ${{ runner.temp }}/install-action-home
        with:
          tool: sccache@0.19.0

      # sccache's GitHub Actions backend reads the runner's cache service URL
      # and token, which only an action's own process is given.
      - name: Expose the Actions cache service to sccache
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');

      # Workspace crates only: rust-cache already holds the dependencies, and
      # sending their ~4,800 rustc calls through sccache too made a cold run
      # write thousands of cache entries, which the Actions cache throttled
      # (3,019 write errors) so the workspace crates were often not stored.
      - name: Compile through sccache
        run: |
          wrapper=$(command -v sccache || echo "$CARGO_HOME/bin/sccache")
          "$wrapper" --version
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WORKSPACE_WRAPPER=$wrapper" >> "$GITHUB_ENV"

      - name: Enable Rust problem matcher
        run: echo "::add-matcher::.github/rust-problem-matcher.json"

      - name: Placeholder frontend dist
        run: mkdir -p ui/dist

      # The runners share one host's memory, and a backlog of Rust lanes and
      # CodeQL Rust extractions starting together took every runner down
      # (#1242). Compilation waits for one of the host's two heavy slots.
      - name: Take a host heavy-build slot
        run: bash .github/scripts/heavy-slot.sh 2400

      - name: Format
        if: matrix.group == 'core'
        run: cargo fmt --all --check

      # Clippy runs in the Rust clippy lane, the app unit-test binary in the
      # Rust app tests shards and the agents and spec packages in Rust agents
      # & spec tests (#1924); `app` is a binary-only package, so excluding it
      # drops nothing else.
      - name: Test
        env:
          PACKAGES: ${{ matrix.packages }}
        # PACKAGES is a list of cargo arguments: split it on spaces.
        run: cargo test $PACKAGES

      - name: sccache statistics
        if: ${{ !cancelled() }}
        run: '"$RUSTC_WORKSPACE_WRAPPER" --show-stats'

      # A cancelled job frees its slot when the runner reaps its processes.
      - name: Release the host heavy-build slot
        if: ${{ !cancelled() }}
        run: rm -f "$RUNNER_TEMP/cartograph-heavy-slot"

      - name: Setup Node.js for explicit local-provider acceptance
        if: matrix.group == 'core' && github.event_name == 'workflow_dispatch' && inputs.local_provider_acceptance
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Run explicit local-provider acceptance
        if: matrix.group == 'core' && github.event_name == 'workflow_dispatch' && inputs.local_provider_acceptance
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@64ec289604e2409eb92fd718495df8a10761a20a
        with:
          task: Run pinned real-local-provider investigation acceptance
          executable: node
          arguments-json: '["scripts/run-local-investigation-acceptance.mjs"]'
          timeout-seconds: '2400'

      - name: Retain local-provider acceptance evidence
        if: always() && matrix.group == 'core' && github.event_name == 'workflow_dispatch' && inputs.local_provider_acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-provider-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cartograph-local-acceptance/evidence
          # The synthetic fixture uses tempfile's hidden .tmp directory prefix.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # Native lock, SQLite, and process-exit coverage uses the actual host modules
  # without building Tauri. This is an additional required complete-suite gate.
  windows-job-ownership:
    name: Windows job ownership
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: windows-latest
    timeout-minutes: 25
    # Line tables only, as in the Linux Rust lanes (#1924).
    env:
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Read pinned Rust toolchain
        id: toolchain
        shell: pwsh
        run: |
          $configuration = Get-Content rust-toolchain.toml -Raw
          $channel = [regex]::Match($configuration, '(?m)^channel\s*=\s*"(\d+\.\d+\.\d+)"\s*$')
          if (-not $channel.Success) { throw 'Expected a pinned Rust release in rust-toolchain.toml' }
          "channel=$($channel.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      # The organisation's Linux runner does not carry Node on its default PATH.
      # This step reaches for `node`, or runs an action that does, so the
      # runtime is installed first, with the same pinned action the rest of
      # the workflow already uses.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # A self-hosted runner keeps the environment it started with, so a
      # machine-wide rustup installed afterwards is not on its PATH yet.
      - name: Use the runner's machine-wide Rust installation
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          $cargo = [Environment]::GetEnvironmentVariable('CARGO_HOME', 'Machine')
          $rustup = [Environment]::GetEnvironmentVariable('RUSTUP_HOME', 'Machine')
          if ($cargo) { "CARGO_HOME=$cargo" >> $env:GITHUB_ENV; "$cargo\bin" >> $env:GITHUB_PATH }
          if ($rustup) { "RUSTUP_HOME=$rustup" >> $env:GITHUB_ENV }

      - name: Install pinned Rust toolchain
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@64ec289604e2409eb92fd718495df8a10761a20a
        with:
          task: Install pinned Windows Rust toolchain
          executable: rustup.exe
          arguments-json: '["toolchain","install","${{ steps.toolchain.outputs.channel }}","--profile","minimal","--component","rustfmt","--component","clippy"]'
          timeout-seconds: '300'

      # CARGO_HOME here is the runner's machine-wide installation. With
      # cache-bin, the post step deletes every file it saw in CARGO_HOME\bin
      # at start, rustup.exe and cargo.exe included, breaking the next job.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-job-ownership
          cache-bin: "false"

      # As in the Linux Rust lanes: sccache serves the 15 workspace crates
      # this test builds, which rust-cache does not keep and which took most
      # of the lane's ~6 minutes of compile (#1924). install-action fails here
      # (its cargo-binstall fallback hits a bash startup failure with the
      # per-step HOME it needs), so the pinned release is fetched and checked
      # against its published SHA-256 directly.
      - name: Install sccache
        shell: pwsh
        env:
          VERSION: v0.19.0
          SHA256: 28be8c61f6b2c89b9eb2869f6af7f78e6f992e78a8abae0ce855fcc129cbeac1
        run: |
          $name = "sccache-$env:VERSION-x86_64-pc-windows-msvc"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest -TimeoutSec 120 -Uri "https://github.com/mozilla/sccache/releases/download/$env:VERSION/$name.zip" -OutFile $zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne $env:SHA256) { throw 'sccache archive checksum mismatch' }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $exe = Join-Path $env:RUNNER_TEMP "$name\sccache.exe"
          & $exe --version
          "SCCACHE_EXE=$exe" >> $env:GITHUB_ENV

      # sccache's GitHub Actions backend reads the runner's cache service URL
      # and token, which only an action's own process is given.
      - name: Expose the Actions cache service to sccache
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');

      # Workspace crates only, as in the Linux lanes. The server is started
      # here, outside the bounded test's process tree, which is torn down when
      # the test ends and would take a server started by cargo with it.
      - name: Compile through sccache
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: 'true'
        run: |
          & $env:SCCACHE_EXE --start-server
          "SCCACHE_GHA_ENABLED=true" >> $env:GITHUB_ENV
          "RUSTC_WORKSPACE_WRAPPER=$env:SCCACHE_EXE" >> $env:GITHUB_ENV

      # Tests here open state.db in temporary directories. Windows cannot
      # delete a file that is still open and TempDir ignores the failure, so
      # leaked directories filled the self-hosted runner's disk (#1307). The
      # runner empties runner.temp for every job, so nothing outlives it.
      - name: Keep test temporary files in the job's temp directory
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'tests'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          "TMP=$temp" >> $env:GITHUB_ENV
          "TEMP=$temp" >> $env:GITHUB_ENV

      - name: Test production job ownership on Windows
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@64ec289604e2409eb92fd718495df8a10761a20a
        with:
          task: Test native Windows job ownership and process exit
          executable: cargo.exe
          arguments-json: '["test","--locked","-p","job-execution-tests","--test","ownership","--","--nocapture"]'
          # A cold optimized-dependency build alone takes ~7 minutes (#1924).
          timeout-seconds: '900'

      - name: sccache statistics
        if: ${{ !cancelled() }}
        shell: pwsh
        run: '& $env:RUSTC_WORKSPACE_WRAPPER --show-stats'

      # The tests must remove every temporary directory they create (#1307).
      # A fixture that drops its directory before the store holding state.db
      # leaks it on Windows (#1307), so the job fails on any leak and names
      # what each left behind. CI tests a PR's head commit, so a branch that
      # predates the fixture fix (#2289) still leaks; it is only reported
      # until the branch merges main. runner.temp is emptied after the job
      # either way.
      - name: Check that the tests removed their temporary directories
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $leaked = @(Get-ChildItem -Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'tests') -Filter '.tmp*' -ErrorAction SilentlyContinue)
          "Leaked test temporary directories: $($leaked.Count)"
          $leaked | Select-Object -First 20 | ForEach-Object {
            "$($_.Name): $((Get-ChildItem -Force -Name -Path $_.FullName) -join ', ')"
          }
          $fixed = Select-String -Quiet -SimpleMatch -Pattern 'Dropped last: Windows cannot remove it' -Path src-tauri/src/jobs/investigations/completion_tests.rs
          if ($leaked.Count -gt 0 -and -not $fixed) {
            "This branch predates the #1307 fixture fix; merge main to enforce the check."
          } elseif ($leaked.Count -gt 0) {
            throw "The tests left $($leaked.Count) temporary directories behind (#1307)"
          }

  # License compliance + supply-chain gate (#222). This remains a complete-
  # suite lane and retains its stable context.
  # The app unit-test binary held about 59 of the Rust job's 80 minutes on a
  # 4-vCPU runner (#1924). Its tests are split across parallel shards, each a
  # plain libtest run, so no test executes differently; the shard script fails
  # when the tests libtest accounts for differ from the shard's selection.
  # The tests form two groups (scripts/app-test-groups.json): a group's shards
  # build the binary without the other group's test modules, which halves the
  # acceptance shards' compile, and app-test-coverage checks that every test
  # ran in exactly one shard. Hosted runners are separate machines, so no
  # heavy-build slot is taken.
  rust-app-tests:
    name: Rust app tests (${{ matrix.group }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [policy, merge-evidence, preflight-evidence, ci-image]
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    container:
      # A digest reference: ci-image resolves the hashed tag to its digest.
      image: ${{ needs.ci-image.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # Not root: root passes the tests that expect permission-denied errors.
      options: --user 1001
      # bounded-command runs `${{ github.action_path }}`, which the runner
      # leaves as the host path in a container (actions/runner#716,
      # true-line/trueline-agent-ci#8). Mount the work tree there too; a
      # symlink would not do, as the script's main-module check compares
      # real paths and silently skips the task.
      volumes:
        - /home/runner/work:/home/runner/work
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    # One shard's tests plus a cold build of the app test binary.
    timeout-minutes: 60
    strategy:
      # Every shard reports, so one failure does not hide another shard's.
      fail-fast: false
      # Shard counts match scripts/app-test-groups.json.
      matrix:
        include:
          - group: acceptance
            shard: 1
            shards: 2
          - group: acceptance
            shard: 2
            shards: 2
          - group: core
            shard: 1
            shards: 4
          - group: core
            shard: 2
            shards: 4
          - group: core
            shard: 3
            shards: 4
          - group: core
            shard: 4
            shards: 4
    # Line tables only, as in the Rust lane (#1924).
    env:
      CARGO_BUILD_JOBS: 6
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Fixed, so the cache key is stable across jobs (see the Rust lane).
      - name: Use a fixed cargo home
        run: echo "CARGO_HOME=$HOME/.cargo-ci" >> "$GITHUB_ENV"

      # The shards build the same dependencies, so they share one cache entry
      # and only the first core shard writes it.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: app-tests
          save-if: ${{ matrix.group == 'core' && matrix.shard == 1 }}

      # As in the Rust lane.
      - name: Install sccache
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        # Per-runner home: install-action rm -rfs its shared ~/.install-action/tmp
        # after each install, deleting a concurrent runner's download (#674).
        env:
          HOME: ${{ runner.temp }}/install-action-home
        with:
          tool: sccache@0.19.0

      # sccache's GitHub Actions backend reads the runner's cache service URL
      # and token, which only an action's own process is given.
      - name: Expose the Actions cache service to sccache
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');

      # Workspace crates only: rust-cache already holds the dependencies, and
      # sending their ~4,800 rustc calls through sccache too made a cold run
      # write thousands of cache entries, which the Actions cache throttled
      # (3,019 write errors) so the workspace crates were often not stored.
      - name: Compile through sccache
        run: |
          wrapper=$(command -v sccache || echo "$CARGO_HOME/bin/sccache")
          "$wrapper" --version
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "SCCACHE_PATH=$wrapper" >> "$GITHUB_ENV"
          # The app crate compiles incrementally instead (#1924), when the
          # checkout has the wrapper: a pull request branched before it was
          # added runs this workflow from the merge ref but checks out its head.
          if [ -x scripts/rustc-app-incremental.sh ]; then
            echo "RUSTC_WORKSPACE_WRAPPER=$GITHUB_WORKSPACE/scripts/rustc-app-incremental.sh" >> "$GITHUB_ENV"
          else
            echo "RUSTC_WORKSPACE_WRAPPER=$wrapper" >> "$GITHUB_ENV"
          fi

      # The app crate's incremental state (#1924). The app-incremental job
      # saves it from main at most once an hour; a shard restores the newest
      # and recompiles only what the pull request changed. rustc keys its
      # state on the crate's content, so a stale entry costs time, not
      # correctness; a new toolchain or Cargo.lock starts a new prefix.
      # Each test group compiles a different app crate, so each has its own.
      - name: Name the app incremental cache
        id: incremental
        env:
          GROUP: ${{ matrix.group }}
          LOCK_HASH: ${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
        run: |
          echo "APP_INCREMENTAL_DIR=$RUNNER_TEMP/app-incremental" >> "$GITHUB_ENV"
          echo "prefix=app-incremental-$GROUP-$LOCK_HASH-" >> "$GITHUB_OUTPUT"
          echo "key=app-incremental-$GROUP-$LOCK_HASH-$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"

      - name: Restore the app incremental cache
        id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.APP_INCREMENTAL_DIR }}
          key: ${{ steps.incremental.outputs.key }}
          restore-keys: ${{ steps.incremental.outputs.prefix }}

      - name: Enable Rust problem matcher
        run: echo "::add-matcher::.github/rust-problem-matcher.json"

      - name: Placeholder frontend dist
        run: mkdir -p ui/dist

      # The shard records each test's seconds for scripts/rust-test-weights.json
      # and the tests its build listed and it selected, for app-test-coverage.
      - name: Test
        env:
          GROUP: ${{ matrix.group }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          SHARD_TIMES_FILE: ${{ runner.temp }}/app-test-times-${{ matrix.group }}-${{ matrix.shard }}.json
          SHARD_LIST_FILE: ${{ runner.temp }}/app-test-list-${{ matrix.group }}-${{ matrix.shard }}.json
        run: node scripts/rust-test-shard.mjs "$SHARD/$SHARDS" --group "$GROUP" -- -p app --lib

      - name: Keep the shard's test times
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-test-times-${{ matrix.group }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-test-times-${{ matrix.group }}-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

      - name: Keep the shard's test list
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-test-list-${{ matrix.group }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-test-list-${{ matrix.group }}-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

      - name: sccache statistics
        if: ${{ !cancelled() }}
        run: '"$SCCACHE_PATH" --show-stats'

  # Every app test that either group's build listed ran in exactly one shard
  # (#1924): a test module gated out of its own group, or left to both, fails
  # here; a test that scripts/app-test-groups.json assigns to no group already
  # failed its shards.
  app-test-coverage:
    name: App test coverage
    needs: [policy, merge-evidence, preflight-evidence, rust-app-tests]
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Collect the shards' test lists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: app-test-list-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-test-lists
          merge-multiple: true

      - name: Every test ran in exactly one shard
        env:
          LISTS: ${{ runner.temp }}/app-test-lists
        run: node scripts/rust-test-shard.mjs --verify-coverage "$LISTS"/*.json

  # Saves the app crate's incremental state from main for the shards (#1924),
  # one entry per test group.
  app-incremental:
    name: App incremental cache (${{ matrix.group }})
    needs: [policy, ci-image]
    # Main only: a pull request's cache is visible to that pull request alone.
    # !cancelled(): ci-image's skipped evidence needs would otherwise skip it.
    if: "!cancelled() && github.event_name == 'push' && needs.ci-image.result == 'success'"
    runs-on: ubuntu-latest
    container:
      # A digest reference: ci-image resolves the hashed tag to its digest.
      image: ${{ needs.ci-image.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # Not root: root passes the tests that expect permission-denied errors.
      options: --user 1001
      # bounded-command runs `${{ github.action_path }}`, which the runner
      # leaves as the host path in a container (actions/runner#716,
      # true-line/trueline-agent-ci#8). Mount the work tree there too; a
      # symlink would not do, as the script's main-module check compares
      # real paths and silently skips the task.
      volumes:
        - /home/runner/work:/home/runner/work
    permissions:
      # write: to delete its older cache entries.
      actions: write
      contents: read
      packages: read
      pull-requests: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [acceptance, core]
    # Line tables only, as in the Rust lane (#1924).
    env:
      CARGO_BUILD_JOBS: 6
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Fixed, so the cache key is stable across jobs (see the Rust lane).
      - name: Use a fixed cargo home
        run: echo "CARGO_HOME=$HOME/.cargo-ci" >> "$GITHUB_ENV"

      # The shards' dependency cache; the shards write it.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: app-tests
          save-if: false

      # As in the Rust lane.
      - name: Install sccache
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        # Per-runner home: install-action rm -rfs its shared ~/.install-action/tmp
        # after each install, deleting a concurrent runner's download (#674).
        env:
          HOME: ${{ runner.temp }}/install-action-home
        with:
          tool: sccache@0.19.0

      # sccache's GitHub Actions backend reads the runner's cache service URL
      # and token, which only an action's own process is given.
      - name: Expose the Actions cache service to sccache
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');

      # Workspace crates only: rust-cache already holds the dependencies, and
      # sending their ~4,800 rustc calls through sccache too made a cold run
      # write thousands of cache entries, which the Actions cache throttled
      # (3,019 write errors) so the workspace crates were often not stored.
      - name: Compile through sccache
        run: |
          wrapper=$(command -v sccache || echo "$CARGO_HOME/bin/sccache")
          "$wrapper" --version
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "SCCACHE_PATH=$wrapper" >> "$GITHUB_ENV"
          # The app crate compiles incrementally instead (#1924), when the
          # checkout has the wrapper: a pull request branched before it was
          # added runs this workflow from the merge ref but checks out its head.
          if [ -x scripts/rustc-app-incremental.sh ]; then
            echo "RUSTC_WORKSPACE_WRAPPER=$GITHUB_WORKSPACE/scripts/rustc-app-incremental.sh" >> "$GITHUB_ENV"
          else
            echo "RUSTC_WORKSPACE_WRAPPER=$wrapper" >> "$GITHUB_ENV"
          fi

      # The app crate's incremental state (#1924). The app-incremental job
      # saves it from main at most once an hour; a shard restores the newest
      # and recompiles only what the pull request changed. rustc keys its
      # state on the crate's content, so a stale entry costs time, not
      # correctness; a new toolchain or Cargo.lock starts a new prefix.
      # Each test group compiles a different app crate, so each has its own.
      - name: Name the app incremental cache
        id: incremental
        env:
          GROUP: ${{ matrix.group }}
          LOCK_HASH: ${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
        run: |
          echo "APP_INCREMENTAL_DIR=$RUNNER_TEMP/app-incremental" >> "$GITHUB_ENV"
          echo "prefix=app-incremental-$GROUP-$LOCK_HASH-" >> "$GITHUB_OUTPUT"
          echo "key=app-incremental-$GROUP-$LOCK_HASH-$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"

      - name: Restore the app incremental cache
        id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.APP_INCREMENTAL_DIR }}
          key: ${{ steps.incremental.outputs.key }}
          restore-keys: ${{ steps.incremental.outputs.prefix }}

      - name: Enable Rust problem matcher
        run: echo "::add-matcher::.github/rust-problem-matcher.json"

      - name: Placeholder frontend dist
        run: mkdir -p ui/dist

      - name: Build the app test binary
        if: steps.restore.outputs.cache-hit != 'true'
        env:
          APP_TEST_GROUP: ${{ matrix.group }}
        run: cargo test -p app --lib --no-run

      # One entry an hour, so frequent merges do not crowd the other lanes'
      # caches out: once this hour's entry exists, later merges skip the build.
      - name: Save the app incremental cache
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.APP_INCREMENTAL_DIR }}
          key: ${{ steps.incremental.outputs.key }}

      # Keep only the group's newest entry: each hour saves under a new key,
      # and about 1 GB an hour would push the other lanes' caches out of the
      # repository's budget. Entries named before the groups go too.
      - name: Drop older app incremental caches
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          KEY: ${{ steps.incremental.outputs.key }}
          GROUP: ${{ matrix.group }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              owner, repo, key: 'app-incremental-', per_page: 100,
            });
            const mine = `app-incremental-${process.env.GROUP}-`;
            const grouped = /^app-incremental-(?:acceptance|core)-/u;
            for (const cache of caches) {
              const stale = cache.key.startsWith(mine) || (cache.key.startsWith('app-incremental-') && !grouped.test(cache.key));
              if (stale && cache.key !== process.env.KEY) {
                await github.rest.actions.deleteActionsCacheById({ owner, repo, cache_id: cache.id });
                core.info(`deleted ${cache.key}`);
              }
            }

      - name: sccache statistics
        if: ${{ !cancelled() }}
        run: '"$SCCACHE_PATH" --show-stats'

  # The agents and spec test binaries were the two longest compiles in the
  # Rust job (about 3.5 minutes each) and a test binary is never served by
  # sccache, so they build in parallel here (#1924). The Rust job excludes
  # exactly these packages; `cargo test -p agents -p spec` runs every target
  # of both: unit, integration and doc tests.
  rust-heavy-tests:
    name: Rust agents & spec tests
    needs: [policy, merge-evidence, preflight-evidence, ci-image]
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    container:
      # A digest reference: ci-image resolves the hashed tag to its digest.
      image: ${{ needs.ci-image.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # Not root: root passes the tests that expect permission-denied errors.
      options: --user 1001
      # bounded-command runs `${{ github.action_path }}`, which the runner
      # leaves as the host path in a container (actions/runner#716,
      # true-line/trueline-agent-ci#8). Mount the work tree there too; a
      # symlink would not do, as the script's main-module check compares
      # real paths and silently skips the task.
      volumes:
        - /home/runner/work:/home/runner/work
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    timeout-minutes: 60
    # Line tables only, as in the Rust lane (#1924).
    env:
      CARGO_BUILD_JOBS: 6
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Fixed, so the cache key is stable across jobs (see the Rust lane).
      - name: Use a fixed cargo home
        run: echo "CARGO_HOME=$HOME/.cargo-ci" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # As in the Rust lane.
      - name: Install sccache
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        # Per-runner home: install-action rm -rfs its shared ~/.install-action/tmp
        # after each install, deleting a concurrent runner's download (#674).
        env:
          HOME: ${{ runner.temp }}/install-action-home
        with:
          tool: sccache@0.19.0

      # sccache's GitHub Actions backend reads the runner's cache service URL
      # and token, which only an action's own process is given.
      - name: Expose the Actions cache service to sccache
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');

      # Workspace crates only: rust-cache already holds the dependencies, and
      # sending their ~4,800 rustc calls through sccache too made a cold run
      # write thousands of cache entries, which the Actions cache throttled
      # (3,019 write errors) so the workspace crates were often not stored.
      - name: Compile through sccache
        run: |
          wrapper=$(command -v sccache || echo "$CARGO_HOME/bin/sccache")
          "$wrapper" --version
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WORKSPACE_WRAPPER=$wrapper" >> "$GITHUB_ENV"

      - name: Enable Rust problem matcher
        run: echo "::add-matcher::.github/rust-problem-matcher.json"

      - name: Placeholder frontend dist
        run: mkdir -p ui/dist

      - name: Test
        run: cargo test -p agents -p spec

      - name: sccache statistics
        if: ${{ !cancelled() }}
        run: '"$RUSTC_WORKSPACE_WRAPPER" --show-stats'

  # Clippy runs beside the tests instead of before them in the Rust job
  # (#1924): about a minute off the critical path warm. `cargo clippy` sets
  # its own workspace wrapper, so this lane does not use sccache.
  rust-clippy:
    name: Rust clippy
    needs: [policy, merge-evidence, preflight-evidence, ci-image]
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    container:
      # A digest reference: ci-image resolves the hashed tag to its digest.
      image: ${{ needs.ci-image.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # Not root: root passes the tests that expect permission-denied errors.
      options: --user 1001
      # bounded-command runs `${{ github.action_path }}`, which the runner
      # leaves as the host path in a container (actions/runner#716,
      # true-line/trueline-agent-ci#8). Mount the work tree there too; a
      # symlink would not do, as the script's main-module check compares
      # real paths and silently skips the task.
      volumes:
        - /home/runner/work:/home/runner/work
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 6
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Fixed, so the cache key is stable across jobs (see the Rust lane).
      - name: Use a fixed cargo home
        run: echo "CARGO_HOME=$HOME/.cargo-ci" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Enable Rust problem matcher
        run: echo "::add-matcher::.github/rust-problem-matcher.json"

      - name: Placeholder frontend dist
        run: mkdir -p ui/dist

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  compliance:
    name: License & supply-chain
    needs: [policy, merge-evidence, preflight-evidence, ci-image]
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    container:
      # A digest reference: ci-image resolves the hashed tag to its digest.
      image: ${{ needs.ci-image.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # Not root: root passes the tests that expect permission-denied errors.
      options: --user 1001
      # bounded-command runs `${{ github.action_path }}`, which the runner
      # leaves as the host path in a container (actions/runner#716,
      # true-line/trueline-agent-ci#8). Mount the work tree there too; a
      # symlink would not do, as the script's main-module check compares
      # real paths and silently skips the task.
      volumes:
        - /home/runner/work:/home/runner/work
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    timeout-minutes: 20
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install locked UI dependencies
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@64ec289604e2409eb92fd718495df8a10761a20a
        with:
          task: Install locked UI dependencies
          executable: npm
          arguments-json: '["ci"]'
          working-directory: ui
          timeout-seconds: '300'
          attempts: '2'
          retry-delay-seconds: '5'

      # The toolchain comes with the CI image (see ci-image).
      - name: Install cargo-about
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        # Per-runner home: install-action rm -rfs its shared ~/.install-action/tmp
        # after each install, deleting a concurrent runner's download (#674).
        env:
          HOME: ${{ runner.temp }}/install-action-home
        with:
          tool: cargo-about@0.9.1

      # Drift gate for the committed THIRD-PARTY-NOTICES.md and the generated
      # in-app acknowledgements module (#340): regenerate in memory from the
      # locked crate graph and ui/package-lock.json and fail on any difference.
      - name: Third-party notices drift check
        run: |
          cargo fetch --locked
          node scripts/generate-notices.mjs --check

      - name: Install cargo-deny
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        # Per-runner home: install-action rm -rfs its shared ~/.install-action/tmp
        # after each install, deleting a concurrent runner's download (#674).
        env:
          HOME: ${{ runner.temp }}/install-action-home
        with:
          tool: cargo-deny@0.20.2

      - name: cargo-deny
        run: cargo deny check

  # Static audit of our own workflow YAML for injection and credential-scoping
  # issues (#261). A local lane until the shared security-scan workflow
  # (qwts/playbook-software-engineering#6) lands; replace this job with that
  # reusable workflow once it does.
  zizmor:
    name: Workflow security audit
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install zizmor
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        # Per-runner home: install-action rm -rfs its shared ~/.install-action/tmp
        # after each install, deleting a concurrent runner's download (#674).
        env:
          HOME: ${{ runner.temp }}/install-action-home
        with:
          tool: zizmor@1.30.1

      # zizmor@1.30.1 has no install-action manifest, so it falls back to
      # cargo-binstall, which installs to <HOME>/.cargo/bin and only adds it to
      # PATH when cargo is absent; the runner has cargo (#674).
      - name: Put installed tools on PATH
        run: echo "$RUNNER_TEMP/install-action-home/.cargo/bin" >> "$GITHUB_PATH"

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona=pedantic --min-severity=medium --config .github/zizmor.yml .github/workflows

  # Web UI: lint, typecheck, unit + Storybook interaction tests, production build.
  frontend:
    name: Frontend
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    # Playwright's own image carries Chromium and its system libraries, so
    # the lane runs no apt and no browser download. Its tag must match the
    # locked playwright version (scripts/workflows.test.mjs checks it).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --ipc=host
      # bounded-command runs `${{ github.action_path }}`, which the runner
      # leaves as the host path in a container (actions/runner#716,
      # true-line/trueline-agent-ci#8). Mount the work tree there too; a
      # symlink would not do, as the script's main-module check compares
      # real paths and silently skips the task.
      volumes:
        - /home/runner/work:/home/runner/work
    timeout-minutes: 30
    # No repo-wide lane group, as for the Rust lane (#669).
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@64ec289604e2409eb92fd718495df8a10761a20a
        with:
          task: Install frontend dependencies
          executable: npm
          arguments-json: '["ci"]'
          working-directory: ui
          timeout-seconds: '300'
          attempts: '2'
          retry-delay-seconds: '5'

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Runs on every full or post-merge lane, even when exact-SHA evidence lets the
  # other heavy jobs skip: the ruleset requires these contexts on the PR's own
  # check rollup, which never includes the preflight run's contexts (#440).
  codeql:
    name: Advanced CodeQL
    needs: [policy, merge-evidence, preflight-evidence, ci-image]
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      (needs.policy.outputs.run_post_merge == 'true' || needs.policy.outputs.run_full == 'true')
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      image: ${{ needs.ci-image.outputs.image }}

  workflow-runtime:
    name: Workflow runtime policy
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout pinned runtime checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: true-line/trueline-agent-ci
          ref: 64ec289604e2409eb92fd718495df8a10761a20a
          path: .ci-runtime-policy
          sparse-checkout: tools/ci-runtime
          persist-credentials: false

      # The organisation's Linux runner does not carry Node on its default PATH.
      # This step reaches for `node`, or runs an action that does, so the
      # runtime is installed first, with the same pinned action the rest of
      # the workflow already uses.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Enforce bounded workflow runtime
        run: node .ci-runtime-policy/tools/ci-runtime/runtime-policy.mjs --root "$GITHUB_WORKSPACE"

  complete:
    name: Complete suite
    needs: [policy, merge-evidence, preflight-evidence, ci-image, docs, rust, rust-app-tests, app-test-coverage, rust-heavy-tests, rust-clippy, windows-job-ownership, compliance, zizmor, frontend, codeql, workflow-runtime]
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify every agreed complete-suite gate
        env:
          DOCS: ${{ needs.docs.result }}
          CI_IMAGE: ${{ needs.ci-image.result }}
          RUST: ${{ needs.rust.result }}
          RUST_APP_TESTS: ${{ needs.rust-app-tests.result }}
          APP_TEST_COVERAGE: ${{ needs.app-test-coverage.result }}
          RUST_HEAVY_TESTS: ${{ needs.rust-heavy-tests.result }}
          RUST_CLIPPY: ${{ needs.rust-clippy.result }}
          WINDOWS_JOB_OWNERSHIP: ${{ needs.windows-job-ownership.result }}
          COMPLIANCE: ${{ needs.compliance.result }}
          ZIZMOR: ${{ needs.zizmor.result }}
          FRONTEND: ${{ needs.frontend.result }}
          CODEQL: ${{ needs.codeql.result }}
          WORKFLOW_RUNTIME: ${{ needs.workflow-runtime.result }}
        run: |
          test "$DOCS" = success
          test "$CI_IMAGE" = success
          test "$RUST" = success
          test "$RUST_APP_TESTS" = success
          test "$APP_TEST_COVERAGE" = success
          test "$RUST_HEAVY_TESTS" = success
          test "$RUST_CLIPPY" = success
          test "$WINDOWS_JOB_OWNERSHIP" = success
          test "$COMPLIANCE" = success
          test "$ZIZMOR" = success
          test "$FRONTEND" = success
          test "$CODEQL" = success
          test "$WORKFLOW_RUNTIME" = success

  post-merge:
    name: Post-merge smoke
    needs: [policy, merge-evidence]
    if: needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Repository integrity smoke
        run: node scripts/check-traceability.mjs && npm run version:check

  gate:
    name: CI
    needs: [policy, merge-evidence, preflight-evidence, complete, codeql, post-merge]
    # A superseded run must release its per-PR
    # concurrency slot instead of waiting for a runner (#1230).
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce the selected lifecycle lane
        env:
          MODE: ${{ needs.policy.outputs.mode }}
          POLICY: ${{ needs.policy.result }}
          COMPLETE: ${{ needs.complete.result }}
          CODEQL: ${{ needs.codeql.result }}
          PREFLIGHT: ${{ needs.preflight-evidence.result }}
          PREFLIGHT_VALIDATED: ${{ needs.preflight-evidence.outputs.validated }}
          MERGE_VALIDATED: ${{ needs.merge-evidence.outputs.validated }}
          POST_MERGE: ${{ needs.post-merge.result }}
        run: |
          test "$POLICY" = success
          case "$MODE" in
            full)
              test "$CODEQL" = success
              if [ "$PREFLIGHT_VALIDATED" = true ]; then
                test "$PREFLIGHT" = success
              else
                test "$COMPLETE" = success
              fi
              ;;
            queue|manual)
              test "$COMPLETE" = success
              ;;
            post-merge)
              test "$CODEQL" = success
              if [ "$MERGE_VALIDATED" = true ]; then
                test "$POST_MERGE" = success
              else
                test "$COMPLETE" = success
              fi
              ;;
            *) exit 1 ;;
          esac
