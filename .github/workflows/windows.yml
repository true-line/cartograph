# Advisory Windows lanes (#227, ADR-0018). These jobs run the standard Rust
# gates on windows-latest with the MSVC toolchain, and build an unsigned NSIS
# installer. Nothing here gates a pull request or the merge queue: ci.yml's
# complete suite does not need these jobs, so an unknown in the C++
# dependencies (usearch, vendored libgit2 and OpenSSL, the tree-sitter
# grammars, bundled SQLite) cannot wedge merges. Promote the gates to required
# once they have stayed green on main for a week.
#
# They run on every push to main, on demand, and on a pull request that
# changes this workflow or the Windows packaging inputs. The per-PR Windows
# gate stays ci.yml's Windows job ownership. The installer built here is
# unsigned-dev: signing needs secrets, which no pull-request run reads
# (windows-installer.yml, ADR-0093).
name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review too: a draft skips every job, and marking it ready
    # starts no other run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/windows.yml
      - .github/workflows/windows-installer.yml
      - scripts/windows-sign.ps1
      - scripts/signing-secrets.mjs
      - scripts/build-agent-runtime.mjs
      - scripts/build-mcp-relay.mjs
      - scripts/agent-runtime-node.json
      - src-tauri/tauri.windows-bundle.conf.json
      # The installer job's manifests, lockfiles and bundled runtime.
      - package.json
      - package-lock.json
      - ui/package.json
      - ui/package-lock.json
      - agent-runtime/**
  workflow_dispatch:

# One run per pull request, and one for main that a newer push queues behind
# rather than cancels, so main always finishes a run.
concurrency:
  group: windows-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  policy:
    name: Action Policy
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Authorize direct workflow event
        uses: true-line/trueline-agent-ci/.github/actions/ci-policy@64ec289604e2409eb92fd718495df8a10761a20a
        with:
          authorization-only: 'true'

  gates:
    name: Windows ${{ matrix.lane }}
    needs: policy
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    # The Linux Rust lane's three test groups and the app's two test groups
    # (scripts/app-test-groups.json), plus fmt and clippy. Each app group
    # builds only its own tests (APP_TEST_GROUP, src-tauri/build.rs) and runs
    # them in one plain libtest process. The acceptance build still compiles
    # the core group's tests, so that lane filters to its one prefix.
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: lint
          - lane: adapters
            packages: -p adapters-lang-ts -p adapters-lang-python -p adapters-lang-java -p adapters-lang-kotlin
          - lane: ingest
            packages: -p ingest -p work-packets -p adapters-lang-go -p app-store
          - lane: core
            packages: >-
              --workspace --exclude app --exclude adapters-lang-ts --exclude adapters-lang-python
              --exclude adapters-lang-java --exclude adapters-lang-kotlin --exclude ingest
              --exclude work-packets --exclude adapters-lang-go --exclude app-store
          - lane: app-core
            packages: -p app --lib
            app_group: core
          - lane: app-acceptance
            packages: -p app --lib
            app_group: acceptance
            filter: 'investigations::worker::tests::acceptance::'
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Read pinned Rust toolchain
        id: toolchain
        shell: pwsh
        run: |
          $configuration = Get-Content rust-toolchain.toml -Raw
          $channel = [regex]::Match($configuration, '(?m)^channel\s*=\s*"(\d+\.\d+\.\d+)"\s*$')
          if (-not $channel.Success) { throw 'Expected a pinned Rust release in rust-toolchain.toml' }
          "channel=$($channel.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install pinned Rust toolchain
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@64ec289604e2409eb92fd718495df8a10761a20a
        with:
          task: Install pinned Windows Rust toolchain
          executable: rustup.exe
          arguments-json: '["toolchain","install","${{ steps.toolchain.outputs.channel }}","--profile","minimal","--component","rustfmt","--component","clippy"]'
          timeout-seconds: '300'

      # cache-bin off for the reason ci.yml's Windows job ownership gives.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-${{ matrix.lane }}
          cache-bin: "false"

      # Tests open state.db in temporary directories, and Windows cannot
      # delete an open file (#1307); runner.temp is emptied after every job.
      - name: Keep test temporary files in the job's temp directory
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'tests'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          "TMP=$temp" >> $env:GITHUB_ENV
          "TEMP=$temp" >> $env:GITHUB_ENV

      - name: Enable Rust problem matcher
        shell: pwsh
        run: '"::add-matcher::.github/rust-problem-matcher.json"'

      - name: Placeholder frontend dist
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path ui/dist | Out-Null

      - name: Format
        if: matrix.lane == 'lint'
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.lane == 'lint'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        if: matrix.lane != 'lint'
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          APP_TEST_GROUP: ${{ matrix.app_group }}
          FILTER: ${{ matrix.filter }}
        # PACKAGES is a list of cargo arguments: split it on spaces. Every
        # package runs, so one run lists all of a lane's Windows failures.
        # FILTER, when set, is the libtest name filter for the lane.
        run: cargo test --locked --no-fail-fast $PACKAGES -- $FILTER

  # The installer lives in windows-installer.yml. No secret is passed here,
  # so pull requests and main build the visibly unsigned-dev installer; a
  # signing caller has no pull-request trigger (#631, ADR-0093).
  installer:
    name: Windows installer
    needs: policy
    permissions:
      contents: read
    uses: ./.github/workflows/windows-installer.yml

  # The same installer for Windows on ARM: cross-built on x64, then installed
  # and checked on a native ARM64 runner (#227).
  installer-arm64:
    name: Windows ARM64 installer
    needs: policy
    permissions:
      contents: read
    uses: ./.github/workflows/windows-installer.yml
    with:
      arch: arm64
