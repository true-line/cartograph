rules:
  secrets-inherit:
    ignore:
      # release.yml's `build` job calls package.yml, the reusable macOS
      # packaging workflow. Signing is all-or-nothing across five repository
      # secrets (AGENTS.md "Signing is all-or-nothing..."), so passing them
      # individually would need to name and maintain all five here instead of
      # in package.yml's own `secrets:` block — `inherit` is the intended
      # shape for this internal, same-repo call, not an oversight.
      - release.yml:172
  dangerous-triggers:
    ignore:
      # version-cut.yml's `workflow_run` trigger (#1378) only starts the tag
      # job for a CI run of a same-repo push to main, checks out that run's
      # exact head SHA, asserts it is the cut commit and runs no code from a
      # pull request; `version-pr` never runs on it.
      - version-cut.yml:5
      # privacy-guard.yml's `workflow_run` trigger scans a same-repo PR's
      # commits as data with PRIVACY_DENYLIST: it checks out main, never runs
      # code from the pull request, and only writes a commit status.
      - privacy-guard.yml:14
